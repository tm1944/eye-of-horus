[project]
name = "hypothesis-globe-api"
version = "0.1.0"
description = "FastAPI over Snowflake MART or local Event fixtures."
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]==0.142.2",
  "snowflake-connector-python==4.7.3",
  "google-genai==2.8.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.uvicorn]
factory = false
